<!-- MAP PAGE -->
<div class="page-header" style="position:sticky;top:0;z-index:100;">
    <div class="d-flex justify-content-between align-items-center">
        <h2><i class="fas fa-map-pin me-2"></i>Bus Stops</h2>
        <button style="background:rgba(255,255,255,0.6);border:none;width:34px;height:34px;border-radius:10px;font-size:0.9rem;color:#374151;cursor:pointer;" onclick="if(map) map.locate({setView:true,maxZoom:15})">
            <i class="fas fa-crosshairs"></i>
        </button>
    </div>
    <div class="search-wrap mt-3">
        <i class="fas fa-search search-icon"></i>
        <input type="text" class="search-input" id="stop-search" placeholder="Search bus stop...">
    </div>
</div>

<div id="map" style="height:260px;flex-shrink:0;"></div>

<div class="map-list-panel">
    <div class="drag-handle"></div>
    <div id="stop-list-container">
        <div class="text-center py-4" style="color:#9CA3AF;font-size:0.82rem;font-weight:500;">
            <i class="fas fa-spinner fa-pulse me-2"></i>Detecting GPS location...
        </div>
    </div>
</div>
